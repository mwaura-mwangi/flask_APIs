<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App (Jinja2)</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eee; }
    .completed { text-decoration: line-through; color: #888; }
    .delete-btn { color: black; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <h2>My Todo App</h2>

  <!-- Standard HTML Form submitting to Flask route /add -->
  <form action="/add" method="POST">
    <input type="text" name="title" placeholder="New task..." required>
    <button type="submit">Add Task</button>
  </form>

  <!-- Jinja Loop -->
  <ul>
    {% for todo in todos %}
      <li>
        <span class="{% if todo.completed %}completed{% endif %}">
          {{ todo.title }}
        </span>
        <a href="/delete/{{ todo.id }}" class="delete-btn">[Delete]</a>
      </li>
    {% else %}
      <li>No tasks found!</li>
    {% endfor %}
  </ul>
</body>
</html>
